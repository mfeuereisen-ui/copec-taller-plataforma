<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plataforma de Seguridad Operacional · Copec Taller</title>
  <meta name="description" content="Plataforma digital del Manual de Seguridad Operacional de Copec Taller." />

  <!-- Favicon inline para evitar 404 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230B3D91' d='M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z'/%3E%3C/svg%3E" />

  <!-- Flags globales que Vue espera al usar la build "esm-browser". -->
  <script>
    window.__VUE_OPTIONS_API__ = true;
    window.__VUE_PROD_DEVTOOLS__ = false;
    window.__VUE_PROD_HYDRATION_MISMATCH_DETAILS__ = false;
  </script>

  <!-- Tailwind CDN (modo dev/play). Para producción: compilar con Tailwind CLI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Los valores viven en assets/css/theme.css (:root).
            // Para cambiar la identidad de marca, edita SOLO ese archivo.
            brand: {
              50:  'rgb(var(--brand-50) / <alpha-value>)',
              100: 'rgb(var(--brand-100) / <alpha-value>)',
              200: 'rgb(var(--brand-200) / <alpha-value>)',
              300: 'rgb(var(--brand-300) / <alpha-value>)',
              500: 'rgb(var(--brand-500) / <alpha-value>)',
              600: 'rgb(var(--brand-600) / <alpha-value>)',
              700: 'rgb(var(--brand-700) / <alpha-value>)',
              800: 'rgb(var(--brand-800) / <alpha-value>)',
              900: 'rgb(var(--brand-900) / <alpha-value>)'
            },
            safe: {
              50:  'rgb(var(--safe-50) / <alpha-value>)',
              100: 'rgb(var(--safe-100) / <alpha-value>)',
              300: 'rgb(var(--safe-300) / <alpha-value>)',
              500: 'rgb(var(--safe-500) / <alpha-value>)',
              600: 'rgb(var(--safe-600) / <alpha-value>)',
              700: 'rgb(var(--safe-700) / <alpha-value>)'
            },
            warn: {
              50:  'rgb(var(--warn-50) / <alpha-value>)',
              100: 'rgb(var(--warn-100) / <alpha-value>)',
              500: 'rgb(var(--warn-500) / <alpha-value>)',
              700: 'rgb(var(--warn-700) / <alpha-value>)'
            },
            danger: {
              50:  'rgb(var(--danger-50) / <alpha-value>)',
              100: 'rgb(var(--danger-100) / <alpha-value>)',
              500: 'rgb(var(--danger-500) / <alpha-value>)',
              700: 'rgb(var(--danger-700) / <alpha-value>)'
            },
            ink: {
              50:  'rgb(var(--ink-50) / <alpha-value>)',
              100: 'rgb(var(--ink-100) / <alpha-value>)',
              200: 'rgb(var(--ink-200) / <alpha-value>)',
              300: 'rgb(var(--ink-300) / <alpha-value>)',
              400: 'rgb(var(--ink-400) / <alpha-value>)',
              500: 'rgb(var(--ink-500) / <alpha-value>)',
              600: 'rgb(var(--ink-600) / <alpha-value>)',
              700: 'rgb(var(--ink-700) / <alpha-value>)',
              900: 'rgb(var(--ink-900) / <alpha-value>)'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          },
          boxShadow: {
            card:  '0 1px 2px 0 rgb(15 23 42 / 0.04), 0 1px 3px 0 rgb(15 23 42 / 0.06)',
            cardH: '0 4px 12px -2px rgb(15 23 42 / 0.08), 0 2px 6px -2px rgb(15 23 42 / 0.06)',
            pop:   '0 10px 32px -8px rgb(15 23 42 / 0.18)'
          },
          animation: {
            'fade-in': 'fadeIn 200ms ease-out',
            'slide-up': 'slideUp 220ms ease-out'
          },
          keyframes: {
            fadeIn:  { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
            slideUp: { '0%': { opacity: 0, transform: 'translateY(8px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } }
          }
        }
      }
    };
  </script>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Theme/print CSS local -->
  <link rel="stylesheet" href="./assets/css/theme.css" />

  <!-- Import map completo con todas las dependencias que usa la aplicación:
       - vue: build esm-browser.prod con compilador de plantillas incluido
       - vue-router: en modo external para compartir la misma instancia de Vue
       - fuse.js: usado por el motor de búsqueda
       - mermaid: usado para renderizar los diagramas de flujo -->
  <script type="importmap">
  {
    "imports": {
      "vue": "https://esm.sh/vue@3.4.21/dist/vue.esm-browser.prod.js",
      "vue-router": "https://esm.sh/vue-router@4.3.0/dist/vue-router.esm-browser.js?external=vue",
      "fuse.js": "https://esm.sh/fuse.js@7.0.0?bundle",
      "mermaid": "https://esm.sh/mermaid@10.9.0?bundle"
    }
  }
  </script>
</head>
<body class="bg-white text-ink-900 font-sans antialiased">
  <div id="app">
    <!-- Loading state visible mientras carga la app -->
    <div class="min-h-screen flex items-center justify-center">
      <div class="text-center">
        <div class="inline-block w-10 h-10 border-4 border-brand-100 border-t-brand-700 rounded-full animate-spin"></div>
        <p class="mt-4 text-ink-500 text-sm">Cargando plataforma…</p>
      </div>
    </div>
  </div>

  <!-- App entry point -->
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
