<!DOCTYPE html>
<html lang="es">
<head>

  <title>Plataforma de Seguridad Operacional · Copec Taller</title>

  <!-- Favicon inline para evitar 404 -->

  <!-- Tailwind CDN (modo dev/play). Para producción: compilar con Tailwind CLI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#EFF6FF',
              100: '#DBEAFE',
              200: '#BFDBFE',
              300: '#93C5FD',
              500: '#3B82F6',
              600: '#2563EB',
              700: '#1D4ED8',
              800: '#1E40AF',
              900: '#0B3D91'
            },
            safe: {
              50:  '#F0FDF4',
              100: '#DCFCE7',
              300: '#86EFAC',
              500: '#22C55E',
              600: '#16A34A',
              700: '#15803D'
            },
            warn: {
              50:  '#FFFBEB',
              100: '#FEF3C7',
              500: '#F59E0B',
              700: '#B45309'
            },
            danger: {
              50:  '#FEF2F2',
              100: '#FEE2E2',
              500: '#EF4444',
              700: '#B91C1C'
            },
            ink: {
              900: '#0F172A',

              500: '#64748B',
              300: '#CBD5E1',
              100: '#F1F5F9',
              50:  '#F8FAFC'

            pop:   '0 10px 32px -8px rgb(15 23 42 / 0.18)'
          },
          animation: {
            'fade-in': 'fadeIn 200ms ease-out',
            'slide-up': 'slideUp 220ms ease-out'
          },
          keyframes: {
            fadeIn:  { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
            slideUp: { '0%': { opacity: 0, transform: 'translateY(8px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } }
          }
        }
      }
    };
  </script>

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Theme/print CSS local -->
  <link rel="stylesheet" href="./assets/css/theme.css" />

  <!-- Import map for ESM dependencies.
       Usamos esm.sh con el flag ?bundle para empaquetar todas las dependencias internas
       y evitar que queden submódulos sin resolver (como @vue/devtools-api). -->

  {
    "imports": {
      "vue": "https://esm.sh/vue@3.4.21?bundle",
      "vue-router": "https://esm.sh/vue-router@4.3.0?bundle&deps=vue@3.4.21",

    }
  }

<body class="bg-white text-ink-900 font-sans antialiased">

    <div class="min-h-screen flex items-center justify-center">
      <div class="text-center">
        <div class="inline-block w-10 h-10 border-4 border-brand-100 border-t-brand-700 rounded-full animate-spin"></div>
        <p class="mt-4 text-ink-500 text-sm">Cargando plataforma…</p>

  </div>

  <!-- App entry point -->
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
